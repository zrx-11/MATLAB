name: Sync Handbook
on:
  push:
    paths:
      - '.github/workflows/sync-handbook.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download handbook
        run: curl -fsSL --retry 3 "https://aka.doubaocdn.com/s/1p3RoIDJKK" -o index.html
      - name: Verify
        run: |
          test "$(wc -c < index.html)" -gt 150000
          grep -q "MATLAB 数学实验指导手册" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "更新手册：补充114道习题与期末模拟卷"
          git push
